name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

# Cancel superseded runs for the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karmakoders_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d karmakoders_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Disposable service container. The runtime/tests (DATABASE_URL) and the Prisma CLI
      # (DIRECT_URL) both point at it. GitHub sets CI=true, which the integration-test guard
      # requires before it accepts a localhost database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karmakoders_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/karmakoders_ci
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint (with eslint-suppressions.json)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Test (unit, then integration)
        run: npm run test

      # Not `npm run build`: that script runs `prisma migrate deploy` against DATABASE_URL.
      - name: Build
        run: npx next build
