swagger: "2.0"
info:
  title: Legacy Payments
  version: "1.0"
host: pay.example
basePath: /api
schemes: [http, https]
securityDefinitions:
  basicAuth:
    type: basic
  queryKey:
    type: apiKey
    in: query
    name: api_key
  oauth:
    type: oauth2
    flow: implicit
    authorizationUrl: http://auth.pay.example/authorize
  brokenKey:
    type: apiKey
paths:
  /charges:
    post:
      operationId: createCharge
      security:
        - basicAuth: []
      parameters:
        - name: body
          in: body
          schema:
            type: object
            properties:
              amount: {type: integer}
      responses:
        "201":
          description: created
          schema:
            type: object
            properties:
              id: {type: string}
              card_number: {type: string}
              client_secret: {type: string}
  /refunds:
    post:
      operationId: createRefund
      responses:
        "202":
          description: accepted
  /debug/vars:
    get:
      operationId: debugVars
      security:
        - queryKey: []
      responses:
        "200":
          description: ok
